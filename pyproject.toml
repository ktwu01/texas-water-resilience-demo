[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-water-resilience-demo"
version = "0.1.0"
description = "Synthetic-data demo of an AI-enabled high-magnitude-flow capture decision support pipeline for Texas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.49"]
# The map tests import dashboard/basin_map.py, which imports pydeck, which ships
# with Streamlit. So the test suite needs the dashboard extra: without it, 31
# tests fail to collect rather than skipping quietly.
dev = ["pytest>=7.4", "ruff>=0.4", "streamlit>=1.49"]

[project.scripts]
twr-pipeline = "scripts.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
