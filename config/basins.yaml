# Major Texas river basins used by the demo.
#
# IMPORTANT: every number below is an order-of-magnitude PLACEHOLDER chosen so
# that the synthetic hydrology behaves plausibly. None of it is an authoritative
# value and none of it should be cited. Replace with TWDB / USGS / TCEQ sources
# before the pipeline is pointed at real observations. See docs/DATA_SOURCES.md.
#
# usgs_site_no is deliberately null: the demo runs on synthetic gauges, and
# inventing a real-looking site number would be worse than leaving a blank.

basins:
  - id: brazos
    name: Brazos
    gauge_id: SYN-BRAZ-01
    usgs_site_no: null
    drainage_area_km2: 116000
    mean_annual_precip_mm: 800
    hmf_percentile: 95.0
    eflow:
      subsistence_cfs: 60
      base_cfs: 240
      pulse_protection_fraction: 0.35
    water_rights:
      unappropriated_fraction: 0.30
      permitted_diversion_af_per_year: 45000

