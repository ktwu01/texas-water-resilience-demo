# Map geography for the dashboard.
#
# WHAT IS REAL HERE AND WHAT IS NOT
#
# Unlike every other config file in this repo, the coordinates below are NOT
# synthetic. They are approximate real-world locations, rounded to about 0.1
# degrees, taken from public physical geography (river mouths, basin centres,
# and unremarkable points near the middle of each decision unit's area). They
# are here so the dashboard can place a basin on a basemap at roughly the right
# spot. No organisation or person is named in this file or anywhere else in the
# repository: the decision units are generic roles.
#
# They are still NOT authoritative:
#
# - `centroid` is a hand-placed visual anchor near the middle of each basin,
#   NOT a computed area centroid of a real watershed polygon.
# - `outlet` is the approximate river mouth / downstream terminus.
# - There are NO basin boundary polygons here. Drawing an invented outline
#   would imply a delineation this repo has not done. A real deployment should
#   replace this file with Watershed Boundary Dataset (WBD) HUC polygons
#   and the state's major river basin shapefiles. See docs/DATA_SOURCES.md.
#
# Consequence for the map: basins are drawn as scaled point markers at their
# anchors, not as filled watershed shapes. That is a deliberate choice to keep
# the visual claim no stronger than the underlying data.
#
# `reaches_coast` marks basins whose outlet is on the Gulf of Mexico. The Brazos,
# Colorado, Trinity, Guadalupe, San Antonio, and Nueces all discharge to the
# Texas coast or to bays behind it; the Rio Grande reaches the Gulf at the
# international border. This repo has no separate "Texas Coast" decision unit,
# so the flag is an attribute of the existing basins rather than a new region.

provenance: approximate_public_geography

# Initial camera, in degrees. Centred so the state and its Gulf coast both sit in
# frame; the anchors span roughly 25.9-33.6 N and 101.5-95.4 W.
view:
  latitude: 30.6
  longitude: -98.5
  zoom: 5.4

basins:
  - id: brazos
    centroid: {lat: 31.4, lon: -97.4}
    outlet: {lat: 28.9, lon: -95.4}   # Freeport, Gulf of Mexico
    reaches_coast: true

  - id: colorado_tx
    centroid: {lat: 31.0, lon: -99.2}
    outlet: {lat: 28.6, lon: -95.9}   # Matagorda Bay
    reaches_coast: true

  - id: trinity
    centroid: {lat: 32.2, lon: -96.3}
    outlet: {lat: 29.8, lon: -94.7}   # Trinity Bay / Galveston Bay
    reaches_coast: true

  - id: guadalupe
    centroid: {lat: 29.7, lon: -98.3}
    outlet: {lat: 28.4, lon: -96.8}   # San Antonio Bay
    reaches_coast: true

  - id: san_antonio
    centroid: {lat: 29.2, lon: -98.0}
    outlet: {lat: 28.5, lon: -97.0}   # confluence with the Guadalupe
    reaches_coast: true

  - id: nueces
    centroid: {lat: 28.9, lon: -99.4}
    outlet: {lat: 27.8, lon: -97.4}   # Nueces Bay / Corpus Christi
    reaches_coast: true

  - id: rio_grande
    centroid: {lat: 29.5, lon: -101.5}
    outlet: {lat: 25.9, lon: -97.2}   # Brownsville, Gulf of Mexico
    reaches_coast: true

# Decision units, at arbitrary approximate points within the region each one
# would plausibly operate in. They are not the address of any organisation, and
# the infrastructure attached to them is illustrative.
sites:
  - id: statewide_screening
    location: {lat: 30.3, lon: -97.7}   # central Texas
    label: Statewide screening

  - id: district_mar
    location: {lat: 33.6, lon: -100.0}  # north-central plains
    label: Groundwater district (MAR)

  - id: facility_asr
    location: {lat: 30.0, lon: -99.1}   # Hill Country, Guadalupe headwaters
    label: ASR facility
